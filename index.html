<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Study Tracker</title>
<meta name="theme-color" content="#0B0D10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0B0D10;
    color: #E7E9EC;
    font-family: 'Inter', system-ui, sans-serif;
    padding: 18px 14px 76px;
    min-height: 100vh;
  }
  .container { max-width: 480px; margin: 0 auto; }
  button { font-family: inherit; }
  input:focus, button:focus { outline: 2px solid #F5C147; outline-offset: 2px; }

  /* ---- Calendar view ---- */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cal-title { font-size: 19px; font-weight: 700; }
  .nav-btn { background: #15181D; border: 1px solid #262B33; color: #E7E9EC; width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .nav-group { display: flex; gap: 8px; }
  .today-btn { background: transparent; border: 1px solid #262B33; color: #8B93A1; font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .preset-btn { background: transparent; border: 1px solid #3A2E14; color: #F5C147; font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
  .preset-btn:hover { background: #191510; }

  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekday { text-align: center; font-size: 11px; color: #5A616D; font-weight: 600; padding: 4px 0; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell { aspect-ratio: 1; border-radius: 10px; border: 1px solid #1C2027; background: #12151A; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
  .day-cell.empty { border: none; background: transparent; cursor: default; }
  .day-cell.today { border-color: #F5C147; }
  .day-cell.has-hours { border-color: #2A3550; background: #11162A; }
  .day-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; }
  .day-cell.today .day-num { color: #F5C147; }
  .day-hours { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6C8CFF; margin-top: 2px; font-weight: 600; }
  .day-bled { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #E5484D; margin-top: 1px; font-weight: 600; }

  .month-summary { text-align: center; font-size: 12px; color: #5A616D; margin-top: 16px; }

  /* ---- Day view ---- */
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .back-btn { background: #15181D; border: 1px solid #262B33; color: #E7E9EC; width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .day-title { font-size: 18px; font-weight: 700; }
  .day-subtitle { font-size: 12px; color: #8B93A1; margin-top: 2px; }

  .clock-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
  .label { font-size: 11px; letter-spacing: 0.08em; color: #8B93A1; font-weight: 600; margin-bottom: 4px; }
  .clock { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 500; line-height: 1; }
  .remaining-box { text-align: right; }
  .remaining { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: #F5C147; }

  .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .hours-summary { flex: 1; background: #131A15; border: 1px solid #2A3A2E; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .hours-summary .val { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; color: #3FA66B; }
  .hours-summary .cap { font-size: 9px; color: #8B93A1; letter-spacing: 0.03em; margin-top: 2px; }
  .hours-summary.bled { background: #1A1213; border-color: #4A1F22; }
  .hours-summary.bled .val { color: #E5484D; }
  .hours-summary.focus { background: #11162A; border-color: #2A3550; }
  .hours-summary.focus .val { color: #6C8CFF; }
  .hours-summary.break { background: #17131F; border-color: #3A2A4A; }
  .hours-summary.break .val { color: #B98CFF; }

  .banner { display: flex; align-items: center; gap: 12px; background: #191510; border: 1px solid #3A2E14; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .banner.gap { background: transparent; border: 1px dashed #262B33; color: #8B93A1; font-size: 13px; padding: 12px 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #F5C147; flex-shrink: 0; animation: pulse 2s ease-in-out infinite; }
  .banner-label { font-size: 15px; font-weight: 600; }
  .banner-sub { font-size: 12.5px; color: #8B93A1; margin-top: 2px; }
  .countdown { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #F5C147; }

  .timeline-row { display: flex; gap: 12px; }
  .track { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .node { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 12px; cursor: pointer; font-size: 11px; }
  .node.manual { background: #3FA66B; border: 2px solid #3FA66B; color: #0B0D10; }
  .node.bled { background: #E5484D; border: 2px solid #E5484D; color: #0B0D10; }
  .node.current { background: #F5C147; border: 2px solid #F5C147; animation: pulse 2s ease-in-out infinite; }
  .node.past { background: #20242B; border: 2px solid #3A3F48; }
  .node.upcoming { background: transparent; border: 2px solid #3A3F48; }
  /* a slot that is BOTH marked complete and marked bled: keep the green done
     node but ring it in red so the bled mark is still visible */
  .node.bled-flag { box-shadow: 0 0 0 2px #0B0D10, 0 0 0 4px #E5484D; }
  .line { width: 2px; flex: 1; background: #20242B; min-height: 22px; }

  .slot-card { flex: 1; display: flex; flex-direction: column; align-items: stretch; gap: 8px; background: #15181D; border: 1px solid #262B33; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card-top { display: flex; align-items: center; gap: 10px; }
  .slot-card.manual { border-color: #2A3A2E; }
  .slot-card.bled { border-color: #4A1F22; }
  .slot-card.current { border-color: #F5C147; }
  .slot-card.past { opacity: 0.75; }
  .focus-btn { align-self: flex-start; background: transparent; border: 1px solid #2A3550; color: #6C8CFF; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .focus-btn:hover { background: #11162A; }
  .focus-btn.running { background: #141B2E; border-color: #6C8CFF; color: #8FA8FF; }
  .focus-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .focus-btn:disabled:hover { background: transparent; }
  .focus-controls { display: flex; align-items: center; gap: 8px; }
  .focus-countdown { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8FA8FF; }
  .reset-btn { background: transparent; border: 1px solid #3A3F48; color: #8B93A1; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .reset-btn:hover { background: #1A1D22; }
  .stop-btn { background: #141B2E; border: 1px solid #6C8CFF; color: #8FA8FF; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .stop-btn:hover { background: #182042; }
  .live-elsewhere { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8FA8FF; font-family: 'IBM Plex Mono', monospace; }
  .live-elsewhere .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #6C8CFF; flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite; }
  .time-inputs { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  input[type="time"] { background: #0B0D10; border: 1px solid #262B33; border-radius: 6px; color: #E7E9EC; font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 5px 4px; width: 84px; }
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
  .dash { color: #8B93A1; font-size: 12px; }
  .label-input { flex: 1; min-width: 0; width: 100%; background: transparent; border: none; color: #E7E9EC; font-size: 14px; padding: 6px 18px 6px 2px; font-family: inherit; cursor: pointer;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  select.label-input option { background: #15181D; color: #E7E9EC; }
  .slot-card.manual .label-input { color: #8B93A1; text-decoration: line-through; }
  .slot-card.bled .label-input { color: #E5A0A3; text-decoration: line-through; }
  /* per-slot focus/bled breakup — lives inside the focus area, so the existing
     1s refresh keeps it live with no extra wiring */
  .slot-stats { display: flex; gap: 12px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .slot-stat { color: #5A616D; }
  .slot-stat b { font-weight: 600; }
  .slot-stat.focus b { color: #6C8CFF; }
  .slot-stat.bled b { color: #E5484D; }
  .label-input.label-custom { cursor: text; border-bottom: 1px solid #F5C147; }
  .label-tab { background: #15181D; border: 1px solid #262B33; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; font-family: 'IBM Plex Mono', monospace; color: #E7E9EC; }

  /* ---- the two side-by-side summary boxes: focus-time breakup + ticked to-dos ---- */
  .summary-boxes { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
  .summary-box { flex: 1; min-width: 0; background: #12151A; border: 1px solid #1C2027; border-radius: 12px; padding: 10px 11px; }
  .summary-box .box-cap { font-size: 10px; letter-spacing: 0.08em; color: #5A616D; font-weight: 600; margin-bottom: 8px; }
  .box-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .box-empty { font-size: 12px; color: #4A505A; }
  .done-tab { max-width: 100%; background: #15181D; border: 1px solid #262B33; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; color: #E7E9EC;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- to-do list ---- */
  .todo-section { margin-top: 22px; }
  .todo-head { font-size: 11px; letter-spacing: 0.08em; color: #8B93A1; font-weight: 600; margin-bottom: 8px; }
  .todo-add { display: flex; gap: 8px; margin-bottom: 10px; }
  .todo-input { flex: 1; min-width: 0; background: #12151A; border: 1px solid #262B33; border-radius: 10px; color: #E7E9EC; font-family: inherit; font-size: 15px; padding: 11px 12px; }
  .todo-input::placeholder { color: #4A505A; }
  .todo-add-btn { flex-shrink: 0; width: 46px; background: #15181D; border: 1px solid #3A2E14; border-radius: 10px; color: #F5C147; font-size: 20px; cursor: pointer; }
  .todo-add-btn:hover { background: #191510; }
  .todo-item { display: flex; align-items: center; gap: 10px; background: #12151A; border: 1px solid #1C2027; border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; }
  .todo-check { flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; border: 1px solid #3A3F48; background: transparent; color: #0B0D10; font-size: 14px; line-height: 1; cursor: pointer; }
  .todo-check.done { background: #3FA66B; border-color: #3FA66B; }
  .todo-text { flex: 1; min-width: 0; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .todo-item.done .todo-text { color: #5A616D; text-decoration: line-through; }
  .todo-empty { font-size: 12.5px; color: #4A505A; padding: 2px 0 4px; }
  .del-btn { background: transparent; border: none; color: #5A616D; padding: 6px; cursor: pointer; flex-shrink: 0; font-size: 15px; }
  .del-btn:hover { color: #E7E9EC; }

  .add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #15181D; border: 1px dashed #3A3F48; border-radius: 10px; color: #8B93A1; font-size: 14px; font-weight: 500; padding: 12px; cursor: pointer; margin-top: 4px; }
  .add-btn:hover { color: #E7E9EC; border-color: #5A616D; }
  .empty-note { text-align: center; color: #5A616D; font-size: 13px; padding: 20px 0; }
  .footer { text-align: center; font-size: 11px; color: #4A505A; margin-top: 16px; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 10.5px; color: #5A616D; margin-top: 4px; margin-bottom: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .dot, .node.current { animation: none; } }

  /* ---- sign-in overlay ---- */
  .auth-overlay { position: fixed; inset: 0; background: #0B0D10; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-overlay[hidden] { display: none; }
  .auth-card { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .auth-title { font-size: 22px; font-weight: 700; }
  .auth-sub { font-size: 13px; color: #5A616D; margin-bottom: 6px; line-height: 1.5; }
  .auth-card input { background: #15181D; border: 1px solid #262B33; border-radius: 10px; color: #E7E9EC; font-family: inherit; font-size: 16px; padding: 12px; }
  .auth-btn { background: #F5C147; border: none; border-radius: 10px; color: #0B0D10; font-size: 15px; font-weight: 600; padding: 13px; cursor: pointer; }
  .auth-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-err { font-size: 12.5px; color: #E5484D; min-height: 16px; line-height: 1.4; }
  .auth-link { background: none; border: none; color: #5A616D; font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 4px; }

  /* ---- sync status pill (fixed, so the calendar layout is untouched) ---- */
  .sync-pill { position: fixed; right: 12px; bottom: 12px; z-index: 40; display: flex; align-items: center; gap: 6px;
    background: #15181D; border: 1px solid #262B33; border-radius: 20px; padding: 6px 11px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B93A1; cursor: pointer; }
  .sync-pill[hidden] { display: none; }
  .sync-pill.synced { opacity: .5; }
  .sync-pill:hover, .sync-pill:focus-visible, .sync-pill:active { opacity: 1; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #5A616D; flex-shrink: 0; }
  .sync-pill.synced .sync-dot { background: #3FA66B; }
  .sync-pill.syncing .sync-dot { background: #F5C147; animation: pulse 1.4s ease-in-out infinite; }
  .sync-pill.offline .sync-dot { background: #E5484D; }
  .sync-menu { position: fixed; right: 12px; bottom: 50px; z-index: 41; background: #15181D; border: 1px solid #262B33; border-radius: 10px; overflow: hidden; min-width: 150px; }
  .sync-menu[hidden] { display: none; }
  .sync-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: #E7E9EC; font-size: 13px; padding: 11px 14px; cursor: pointer; }
  .sync-menu button + button { border-top: 1px solid #262B33; }
  .sync-menu button:hover { background: #1C2027; }
  .sync-menu .danger { color: #E5A0A3; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<div class="sync-pill" id="sync-pill" hidden><span class="sync-dot"></span><span id="sync-text">local</span></div>
<div class="sync-menu" id="sync-menu" hidden>
  <button type="button" id="menu-sync">Sync now</button>
  <button type="button" id="menu-signout" class="danger">Sign out</button>
</div>

<div class="auth-overlay" id="auth-overlay" hidden>
  <form class="auth-card" id="auth-form">
    <div class="auth-title">Study Tracker</div>
    <div class="auth-sub" id="auth-sub">Sign in to keep your data backed up and synced across your phone and tablet.</div>
    <input type="email" id="auth-email" placeholder="Email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input type="password" id="auth-pass" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" class="auth-btn" id="auth-btn">Sign in</button>
    <div class="auth-err" id="auth-err"></div>
    <button type="button" class="auth-link" id="auth-offline">Skip &mdash; use this device only</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>

<script>
const STORAGE_KEY = 'schedule-calendar-data';
let data = {};                   // { "YYYY-MM-DD": [ {id,start,end,label,done}, ... ] }
let view = 'calendar';           // 'calendar' | 'day'
const today = new Date();
let calYear = today.getFullYear();
let calMonth = today.getMonth(); // 0-indexed
let activeDate = null;           // "YYYY-MM-DD" for day view
const focusTimers = {};          // { [slotId]: { key, startedAt } }, mirrored into FOCUS_KEY
const FOCUS_KEY = 'schedule-calendar-focus';
const LIVE_HEARTBEAT_MS = 45000; // how often a running session pings slot.live while synced
const LIVE_STALE_MS = 120000;    // how long a viewer trusts a heartbeat before treating it as dead

// Local storage is the primary write target: it is instant, works offline, and
// means the app is never blank. Supabase is the durable, cross-device copy.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function load() {
  try {
    const raw = store.get(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return {};
}
function save() {
  store.set(STORAGE_KEY, JSON.stringify(data));
  scheduleFlush();
}

/* ---------------------------------------------------------------------
   Running focus sessions.

   A session used to live only in memory, so locking the phone — which
   lets iOS discard the page — lost both the session and every second
   logged since Start. Two independent safeguards now prevent that:

     1. checkpointFocus() banks elapsed time into slot.focusSeconds
        whenever the page is hidden, so a discarded page loses nothing.
     2. focusTimers is mirrored to localStorage, so a reload resumes the
        session instead of silently dropping it.

   The timer map itself is kept OUT of `data` on purpose: a running session
   belongs to one device, and syncing the map would make the tablet believe
   the phone's session was its own. Only the banked seconds sync, plus a
   lightweight `slot.live` heartbeat ({ startedAt, heartbeatAt }) so other
   devices can *display* "running elsewhere" without ever being able to
   control or claim the session. A heartbeat older than LIVE_STALE_MS is
   treated as dead by viewers, so a crashed tab can't strand a stale badge.
   --------------------------------------------------------------------- */

function saveFocusTimers() {
  store.set(FOCUS_KEY, JSON.stringify(focusTimers));
}

// Fold a running timer's elapsed time into the slot and stop tracking it.
// Capped at the slot's scheduled end, so a session left running overnight
// never counts past the slot it belongs to.
function finalizeTimer(idKey, upto) {
  const t = focusTimers[idKey];
  if (!t) return;
  const slot = (data[t.key] || []).find(x => String(x.id) === idKey);
  if (slot) {
    const end = combineDateTime(t.key, slot.end).getTime();
    const cappedNow = Math.min(upto === undefined ? Date.now() : upto, end);
    slot.focusSeconds = (slot.focusSeconds || 0) + Math.max(0, (cappedNow - t.startedAt) / 1000);
    delete slot.live;
  }
  delete focusTimers[idKey];
}

// Bank what has accrued so far without ending the session: the elapsed time
// moves into focusSeconds and the clock restarts from now. Banking and
// resetting together is what stops a second checkpoint double-counting.
// Also runs on a timer (LIVE_HEARTBEAT_MS) while a session is open in the
// foreground — not just on hide/pagehide — so other devices can see roughly
// live progress via slot.live instead of the tablet looking "stopped" until
// it's backgrounded or Stop is pressed.
function checkpointFocus() {
  const ids = Object.keys(focusTimers);
  if (!ids.length) return;
  const nowMs = Date.now();
  let touched = false;
  ids.forEach(idKey => {
    const t = focusTimers[idKey];
    const slot = (data[t.key] || []).find(x => String(x.id) === idKey);
    if (!slot) { delete focusTimers[idKey]; touched = true; return; }
    const end = combineDateTime(t.key, slot.end).getTime();
    const cappedNow = Math.min(nowMs, end);
    const gained = Math.max(0, (cappedNow - t.startedAt) / 1000);
    if (gained > 0) { slot.focusSeconds = (slot.focusSeconds || 0) + gained; touched = true; }
    if (nowMs >= end) {
      delete focusTimers[idKey];
      delete slot.live;
      touched = true;
    } else {
      t.startedAt = nowMs;
      slot.live = { startedAt: (slot.live && slot.live.startedAt) || nowMs, heartbeatAt: nowMs };
      touched = true;
    }
  });
  saveFocusTimers();
  if (touched) save();
}

// Bring back sessions that were running when the page went away. Runs before
// the first render so a live slot never flashes as idle first.
function restoreFocusTimers() {
  let stored = {};
  try { stored = JSON.parse(store.get(FOCUS_KEY) || '{}') || {}; } catch (e) { stored = {}; }
  const nowMs = Date.now();
  let banked = false;

  Object.keys(stored).forEach(idKey => {
    const t = stored[idKey];
    if (!t || !t.key || typeof t.startedAt !== 'number') return;
    const slot = (data[t.key] || []).find(x => String(x.id) === idKey);
    if (!slot) return;                       // slot deleted while we were away

    focusTimers[idKey] = { key: t.key, startedAt: t.startedAt };
    const end = combineDateTime(t.key, slot.end).getTime();
    if (nowMs >= end) {                      // slot finished while away — close it out
      finalizeTimer(idKey, nowMs);
      banked = true;
    }
  });

  saveFocusTimers();
  if (banked) save();
}

// `done` and `bled` are independent flags. Older data stored them as a single
// mutually-exclusive `status` field, so migrate that on the way in.
function normalize(obj) {
  Object.keys(obj || {}).forEach(k => {
    if (!Array.isArray(obj[k])) return;
    obj[k].forEach(slot => {
      if (slot.kind === 'todo') {          // to-do entries carry no time fields
        slot.text = String(slot.text || '');
        slot.done = !!slot.done;
        return;
      }
      if (slot.status !== undefined) {
        slot.done = slot.status === 'done' || slot.done === true;
        slot.bled = slot.status === 'bled';
        delete slot.status;
      } else {
        slot.done = !!slot.done;
        slot.bled = !!slot.bled;
      }
      slot.focusSeconds = slot.focusSeconds || 0;
    });
  });
  return obj;
}
// Date.now() alone repeats when two entries are created inside the same
// millisecond, and a duplicate id would make delete remove both rows.
let lastId = 0;
function nextId() { lastId = Math.max(Date.now(), lastId + 1); return lastId; }
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayKey() { return dateKey(today.getFullYear(), today.getMonth(), today.getDate()); }

/* A day's array holds two kinds of entry: time slots, and to-do items marked
   with kind:'todo'. Keeping them in one array means the existing sync, merge
   and storage paths carry to-dos for free, with no schema change. Everything
   that reasons about time must go through daySlots(), never data[key]. */
function daySlots(key) { return (data[key] || []).filter(s => s.kind !== 'todo'); }
function dayTodos(key) { return (data[key] || []).filter(s => s.kind === 'todo'); }

function minutesOf(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function dayHours(key) {
  const slots = daySlots(key);
  const totalMin = slots.filter(s => s.done).reduce((sum, s) => {
    const diff = minutesOf(s.end) - minutesOf(s.start);
    return sum + Math.max(diff, 0);
  }, 0);
  return totalMin / 60;
}
function bledHours(key) {
  const slots = daySlots(key);
  const now = new Date();
  let totalSec = 0;
  // bled accrues for every slot regardless of its completion mark — marking a
  // session complete must never wipe out bled time
  slots.forEach(s => { totalSec += slotBledOf(s, key, now); });
  return totalSec / 3600;
}
function breakHours(key) {
  const slots = daySlots(key).slice().sort((a, b) => (a.start < b.start ? -1 : 1));
  if (slots.length < 2) return 0;
  const spanMin = minutesOf(slots[slots.length - 1].end) - minutesOf(slots[0].start);
  const scheduledMin = slots.reduce((sum, s) => sum + Math.max(minutesOf(s.end) - minutesOf(s.start), 0), 0);
  return Math.max(spanMin - scheduledMin, 0) / 60;
}
function dayFocusHours(key) {
  const slots = daySlots(key);
  const now = new Date();
  const totalSec = slots.reduce((sum, s) => sum + slotFocusSec(s, key, now), 0);
  return totalSec / 3600;
}
function labelFocusHours(key, label) {
  const slots = daySlots(key).filter(s => (s.label || '') === label);
  const now = new Date();
  const totalSec = slots.reduce((sum, s) => sum + slotFocusSec(s, key, now), 0);
  return totalSec / 3600;
}
function slotElapsedSec(slot, key, now) {
  const start = combineDateTime(key, slot.start).getTime();
  const end = combineDateTime(key, slot.end).getTime();
  const nowMs = now.getTime();
  return Math.max(0, Math.min(nowMs, end) - start) / 1000;
}
function slotFocusSec(slot, key, now) {
  let sec = slot.focusSeconds || 0;
  const timer = focusTimers[String(slot.id)];
  if (timer) {
    const end = combineDateTime(key, slot.end).getTime();
    const cappedNow = Math.min(now.getTime(), end);
    sec += Math.max(0, (cappedNow - timer.startedAt) / 1000);
  }
  return sec;
}
function slotBledSec(slot, key, now) {
  return Math.max(slotElapsedSec(slot, key, now) - slotFocusSec(slot, key, now), 0);
}
// a manually-bled slot counts its whole scheduled duration as bled; otherwise
// bled is whatever elapsed time wasn't spent in focus
function slotBledOf(slot, key, now) {
  if (slot.bled) return Math.max(minutesOf(slot.end) - minutesOf(slot.start), 0) * 60;
  return slotBledSec(slot, key, now);
}
function setFlag(key, id, field, value) {
  const slot = (data[key] || []).find(s => s.id === id);
  if (!slot) return;
  slot[field] = value;
  save();
}
function fmtHours(h) {
  if (h <= 0) return '0h';
  const rounded = Math.round(h * 10) / 10;
  return rounded % 1 === 0 ? rounded + 'h' : rounded.toFixed(1) + 'h';
}
function fmtHours2(h) {
  if (h <= 0) return '0.00h';
  return h.toFixed(2) + 'h';
}

// ---- live time helpers (combine a slot's clock time with the date being viewed) ----
function combineDateTime(key, timeStr) {
  const [y, m, d] = key.split('-').map(Number);
  const [h, min] = timeStr.split(':').map(Number);
  return new Date(y, m - 1, d, h, min, 0, 0);
}
function timeStatus(slot, key, now) {
  const start = combineDateTime(key, slot.start);
  const end = combineDateTime(key, slot.end);
  if (now >= end) return 'past';
  if (now >= start && now < end) return 'current';
  return 'upcoming';
}
function remainingOf(slot, key, now) {
  const start = combineDateTime(key, slot.start);
  const end = combineDateTime(key, slot.end);
  if (now >= end) return 0;
  if (now >= start) return end - now;
  return end - start;
}
function fmtDuration(ms) {
  if (ms <= 0) return '0m';
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h <= 0 ? m + 'm' : h + 'h ' + m + 'm';
}
function fmtCountdown(ms) {
  if (ms <= 0) return '00:00:00';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
}
function fmtClock(d) {
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['S','M','T','W','T','F','S'];
const LABEL_OPTIONS = ['Audit', 'FR', 'AFM', 'IDT', 'DT'];

const PRESET_SLOTS = [
  { start: '08:30', end: '10:00', label: 'Audit' },
  { start: '11:00', end: '12:00', label: 'Audit' },
  { start: '13:00', end: '13:30', label: 'Audit' },
  { start: '14:00', end: '17:00', label: 'FR' },
  { start: '18:00', end: '20:00', label: 'FR' },
  { start: '21:00', end: '23:00', label: 'FR' },
];

function applyPreset(key) {
  if (daySlots(key).length > 0) {
    const ok = confirm('This replaces the existing slots for this day. Continue?');
    if (!ok) return;
  }
  // the day's to-dos are untouched: only the time slots are replaced
  data[key] = dayTodos(key).concat(PRESET_SLOTS.map((s, i) => ({
    id: Date.now() + i,
    start: s.start,
    end: s.end,
    label: s.label,
    done: false,
    bled: false,
    focusSeconds: 0,
  })));
  save();
  renderApp();
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayKey();
  a.href = url;
  a.download = 'tracker-data-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
        alert('That file doesn\u2019t look like a valid export.');
        return;
      }
      const ok = confirm('This replaces all current data with the imported file. Continue?');
      if (!ok) return;
      data = normalize(parsed);
      save();
      renderApp();
    } catch (e) {
      alert('Couldn\u2019t read that file — make sure it\u2019s a JSON export from this tracker.');
    }
  };
  reader.readAsText(file);
}

function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (view === 'calendar') app.appendChild(buildCalendarView());
  else app.appendChild(buildDayView(activeDate));
}

function buildCalendarView() {
  const wrap = document.createElement('div');

  const header = document.createElement('div');
  header.className = 'cal-header';
  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = MONTH_NAMES[calMonth] + ' ' + calYear;
  const navGroup = document.createElement('div');
  navGroup.className = 'nav-group';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn';
  prevBtn.textContent = '‹';
  prevBtn.onclick = () => { changeMonth(-1); };
  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn';
  nextBtn.textContent = '›';
  nextBtn.onclick = () => { changeMonth(1); };
  navGroup.append(prevBtn, nextBtn);
  header.append(title, navGroup);
  wrap.appendChild(header);

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';

  const todayBtn = document.createElement('button');
  todayBtn.className = 'today-btn';
  todayBtn.textContent = 'Jump to today';
  todayBtn.onclick = () => {
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderApp();
  };

  const exportBtn = document.createElement('button');
  exportBtn.className = 'today-btn';
  exportBtn.textContent = 'Export data';
  exportBtn.onclick = exportData;

  const importBtn = document.createElement('button');
  importBtn.className = 'today-btn';
  importBtn.textContent = 'Import data';
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/json';
  fileInput.style.display = 'none';
  fileInput.onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); };
  importBtn.onclick = () => fileInput.click();

  btnRow.append(todayBtn, exportBtn, importBtn, fileInput);
  wrap.appendChild(btnRow);

  const weekRow = document.createElement('div');
  weekRow.className = 'weekday-row';
  WEEKDAYS.forEach(w => {
    const el = document.createElement('div');
    el.className = 'weekday';
    el.textContent = w;
    weekRow.appendChild(el);
  });
  wrap.appendChild(weekRow);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < firstWeekday; i++) {
    const blank = document.createElement('div');
    blank.className = 'day-cell empty';
    grid.appendChild(blank);
  }

  let monthTotal = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(calYear, calMonth, d);
    const hours = dayFocusHours(key);
    const bled = bledHours(key);
    monthTotal += hours;
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (key === todayKey() ? ' today' : '') + (hours > 0 ? ' has-hours' : '');
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);
    if (hours > 0) {
      const h = document.createElement('div');
      h.className = 'day-hours';
      h.textContent = fmtHours(hours);
      cell.appendChild(h);
    }
    if (bled > 0) {
      const b = document.createElement('div');
      b.className = 'day-bled';
      b.textContent = fmtHours(bled);
      cell.appendChild(b);
    }
    cell.onclick = () => { activeDate = key; view = 'day'; renderApp(); };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  const summary = document.createElement('div');
  summary.className = 'month-summary';
  summary.textContent = fmtHours(monthTotal) + ' marked this month';
  wrap.appendChild(summary);

  return wrap;
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderApp();
}

function buildDayView(key) {

  const clock = document.createElement('div');

  clock.id = 'clock';

  remBox.className = 'remaining-box';
  const remLbl = document.createElement('div');

  const bledCap = document.createElement('div');
  bledCap.className = 'cap';
  bledCap.textContent = 'TIME BLED';

  const breakSummary = document.createElement('div');

  statsRow.append(summary, focusSummary, bledSummary, breakSummary);

  wrap.appendChild(footer);

}

// ---- the two summary boxes: per-label focus breakup, and ticked-off to-dos ----
// day view only; rebuilt wholesale on every stats refresh, so both stay live
function buildSummaryBoxes(key) {
  const wrap = document.createElement('div');
  wrap.id = 'summary-boxes';
  wrap.className = 'summary-boxes';
  wrap.append(buildFocusBox(key), buildDoneBox(key));
  return wrap;
}

function buildBox(caption) {
  const box = document.createElement('div');
  box.className = 'summary-box';
  const cap = document.createElement('div');
  cap.className = 'box-cap';
  cap.textContent = caption;
  const items = document.createElement('div');
  items.className = 'box-items';
  box.append(cap, items);
  return { box, items };
}

// per-label focus-time tabs, e.g. "Audit · 2.26h"
function buildFocusBox(key) {
  const parts = buildBox('FOCUS TIME');
  const used = new Set(daySlots(key).map(s => s.label).filter(Boolean));
  const totals = allLabels()
    .filter(label => used.has(label))
    .map(label => ({ label, hours: labelFocusHours(key, label) }))
    .filter(t => t.hours > 0);
  if (totals.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'box-empty';
    empty.textContent = 'No focus time logged yet';
    parts.items.appendChild(empty);
    return parts.box;
  }
  totals.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'label-tab';
    tab.textContent = t.label + ' \u00b7 ' + fmtHours2(t.hours);
    parts.items.appendChild(tab);
  });
  return parts.box;
}

// one tab per to-do already ticked off on this day
function buildDoneBox(key) {
  const parts = buildBox('TO-DO DONE');
  const done = dayTodos(key).filter(t => t.done);
  if (done.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'box-empty';
    empty.textContent = 'Nothing ticked yet';
    parts.items.appendChild(empty);
    return parts.box;
  }
  done.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'done-tab';
    tab.textContent = t.text;
    tab.title = t.text;
    parts.items.appendChild(tab);
  });
  return parts.box;
}

function refreshSummaryBoxes(key) {
  const el = document.getElementById('summary-boxes');
  if (!el) return;
  el.replaceWith(buildSummaryBoxes(key));
}

/* ---------------------------------------------------------------------
   To-do list. Items share the day's array with the time slots (tagged
   kind:'todo'), so they sync, export and merge with no extra plumbing.
   --------------------------------------------------------------------- */

function buildTodoSection(key) {
  const wrap = document.createElement('div');
  wrap.className = 'todo-section';

  const head = document.createElement('div');
  head.className = 'todo-head';
  head.textContent = 'TO-DO';

  const addRow = document.createElement('div');
  addRow.className = 'todo-add';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'todo-input';
  input.placeholder = 'Add a to-do\u2026';
  input.maxLength = 120;
  const addBtn = document.createElement('button');
  addBtn.className = 'todo-add-btn';
  addBtn.setAttribute('aria-label', 'Add to-do');
  addBtn.textContent = '+';
  const submit = () => {
    if (addTodo(key, input.value)) { input.value = ''; input.focus(); }
  };
  addBtn.onclick = submit;
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
  addRow.append(input, addBtn);

  const list = document.createElement('div');
  list.id = 'todo-list';

  wrap.append(head, addRow, list);
  renderTodoList(key, list);
  return wrap;
}

function renderTodoList(key, container) {
  container.innerHTML = '';
  const todos = dayTodos(key);
  if (todos.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'todo-empty';
    empty.textContent = 'No to-dos yet';
    container.appendChild(empty);
    return;
  }
  todos.forEach(todo => {
    const row = document.createElement('div');
    row.className = 'todo-item' + (todo.done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'todo-check' + (todo.done ? ' done' : '');
    check.setAttribute('aria-label', todo.done ? 'Mark not done' : 'Mark done');
    check.textContent = todo.done ? '\u2713' : '';
    check.onclick = () => toggleTodo(key, todo.id);

    const text = document.createElement('div');
    text.className = 'todo-text';
    text.textContent = todo.text;
    text.title = todo.text;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.setAttribute('aria-label', 'Delete to-do');
    del.textContent = '\u2715';
    del.onclick = () => removeTodo(key, todo.id);

    row.append(check, text, del);
    container.appendChild(row);
  });
}

function addTodo(key, text) {
  const trimmed = (text || '').trim();
  if (!trimmed) return false;
  if (!data[key]) data[key] = [];
  data[key].push({ id: nextId(), kind: 'todo', text: trimmed, done: false });
  save();
  refreshTodos(key);
  return true;
}

function toggleTodo(key, id) {
  const todo = dayTodos(key).find(t => t.id === id);
  if (!todo) return;
  todo.done = !todo.done;
  save();
  refreshTodos(key);
}

function removeTodo(key, id) {
  data[key] = (data[key] || []).filter(s => s.id !== id);
  save();
  refreshTodos(key);
}

// the second-by-second stats refresh deliberately leaves #todo-list alone —
// rebuilding it would steal focus from the input mid-typing
function refreshTodos(key) {
  const list = document.getElementById('todo-list');
  if (list) renderTodoList(key, list);
  refreshSummaryBoxes(key);
}

function renderSlotList(key, container) {
  container.innerHTML = '';
  const slots = daySlots(key).slice().sort((a, b) => (a.start < b.start ? -1 : 1));
  const now = new Date();

  if (slots.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-note';
    empty.textContent = 'No slots yet — add one below';
    container.appendChild(empty);
    return;
  }

  slots.forEach((slot, i) => {
    const auto = slot.done ? 'manual' : slot.bled ? 'bled' : timeStatus(slot, key, now);
    const row = document.createElement('div');
    row.className = 'timeline-row';

    const track = document.createElement('div');
    track.className = 'track';
    const node = document.createElement('div');
    node.className = 'node ' + auto + (slot.done && slot.bled ? ' bled-flag' : '');
    node.textContent = slot.done ? '\u2713' : slot.bled ? '\u2715' : '';
    attachTapHandlers(node, key, slot.id);
    track.appendChild(node);
    if (i < slots.length - 1) {
      const line = document.createElement('div');
      line.className = 'line';
      track.appendChild(line);
    }
    row.appendChild(track);

    const card = document.createElement('div');
    card.className = 'slot-card ' + auto;

    const timeWrap = document.createElement('div');
    timeWrap.className = 'time-inputs';
    const startInput = document.createElement('input');
    startInput.type = 'time';
    startInput.value = slot.start;
    startInput.onchange = e => updateSlot(key, slot.id, 'start', e.target.value);
    const dash = document.createElement('span');
    dash.className = 'dash';
    dash.textContent = '–';
    const endInput = document.createElement('input');
    endInput.type = 'time';
    endInput.value = slot.end;
    endInput.onchange = e => updateSlot(key, slot.id, 'end', e.target.value);
    timeWrap.append(startInput, dash, endInput);

    const labelInput = buildLabelControl(key, slot);

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.setAttribute('aria-label', 'Delete slot');
    delBtn.textContent = '\u2715';
    delBtn.onclick = () => removeSlot(key, slot.id);

    const topRow = document.createElement('div');
    topRow.className = 'card-top';
    topRow.append(timeWrap, labelInput, delBtn);

    card.append(topRow, buildFocusArea(key, slot, now));
    row.appendChild(card);
    container.appendChild(row);
  });
}

const CUSTOM_VALUE = '__custom__';
const customEditing = {};   // { [slotId]: true } — transient, while typing a custom label

// every label the tracker knows about: the fixed list first, then any custom
// ones already typed on some slot, so a custom label stays reusable from the dropdown
function allLabels() {
  const set = new Set(LABEL_OPTIONS);
  Object.keys(data).forEach(k => {
    (data[k] || []).forEach(s => { if (s.label) set.add(s.label); });
  });
  return Array.from(set);
}

function buildLabelControl(key, slot) {
  if (customEditing[slot.id]) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'label-input label-custom';
    input.placeholder = 'Type label';
    input.maxLength = 24;
    input.value = LABEL_OPTIONS.indexOf(slot.label) === -1 ? (slot.label || '') : '';
    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      delete customEditing[slot.id];
      updateSlot(key, slot.id, 'label', input.value.trim());
    };
    input.onblur = commit;
    input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
    setTimeout(() => input.focus(), 0);
    return input;
  }

  const sel = document.createElement('select');
  sel.className = 'label-input';
  const blankOpt = document.createElement('option');
  blankOpt.value = '';
  blankOpt.textContent = 'Label';
  blankOpt.disabled = true;
  sel.appendChild(blankOpt);
  allLabels().forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    sel.appendChild(o);
  });
  const customOpt = document.createElement('option');
  customOpt.value = CUSTOM_VALUE;
  customOpt.textContent = '+ Custom\u2026';
  sel.appendChild(customOpt);

  sel.value = slot.label || '';
  sel.title = slot.label || '';
  sel.onchange = e => {
    if (e.target.value === CUSTOM_VALUE) {
      customEditing[slot.id] = true;
      renderSlotList(key, document.getElementById('slot-list'));
      return;
    }
    updateSlot(key, slot.id, 'label', e.target.value);
  };
  return sel;
}

function buildFocusArea(key, slot, now) {
  const idKey = String(slot.id);
  const container = document.createElement('div');
  container.className = 'focus-area';
  container.id = 'focus-area-' + idKey;
  const timer = focusTimers[idKey];

  if (timer) {
    const wrap = document.createElement('div');
    wrap.className = 'focus-controls';
    const end = combineDateTime(key, slot.end).getTime();
    const cd = document.createElement('span');
    cd.className = 'focus-countdown';
    cd.textContent = fmtCountdown(Math.max(end - now.getTime(), 0));
    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = 'Reset';
    resetBtn.onclick = () => resetFocus(key, slot.id);
    const stopBtn = document.createElement('button');
    stopBtn.className = 'stop-btn';
    stopBtn.textContent = 'Stop';
    stopBtn.onclick = () => stopFocus(key, slot.id);
    wrap.append(cd, resetBtn, stopBtn);
    container.appendChild(wrap);
  } else if (slot.live && (now.getTime() - slot.live.heartbeatAt) < LIVE_STALE_MS) {
    // a session is running on another device: its heartbeat is still fresh,
    // so show that instead of a Start button rather than risk a second
    // session on this device double-counting the same time
    const badge = document.createElement('div');
    badge.className = 'live-elsewhere';
    const startedAt = new Date(slot.live.startedAt);
    badge.innerHTML = '<span class="live-dot"></span>Live on another device · started ' +
      pad(startedAt.getHours()) + ':' + pad(startedAt.getMinutes());
    container.appendChild(badge);
  } else {
    const btn = document.createElement('button');
    btn.className = 'focus-btn';
    const status = timeStatus(slot, key, now);
    btn.disabled = status === 'past';
    btn.textContent = status === 'upcoming' ? 'Start now' : 'Focus mode';
    btn.onclick = () => startFocus(key, slot.id);
    container.appendChild(btn);
  }

  // per-slot breakup — rebuilt along with the focus area every second, so it
  // stays live while a session is running
  const stats = document.createElement('div');
  stats.className = 'slot-stats';
  const focusEl = document.createElement('span');
  focusEl.className = 'slot-stat focus';
  focusEl.innerHTML = 'Focus <b>' + fmtHours2(slotFocusSec(slot, key, now) / 3600) + '</b>';
  const bledEl = document.createElement('span');
  bledEl.className = 'slot-stat bled';
  bledEl.innerHTML = 'Bled <b>' + fmtHours2(slotBledOf(slot, key, now) / 3600) + '</b>';
  stats.append(focusEl, bledEl);
  container.appendChild(stats);

  return container;
}

function startFocus(key, id) {
  const slot = (data[key] || []).find(s => s.id === id);
  if (!slot) return;
  const now = new Date();
  const status = timeStatus(slot, key, now);
  if (status === 'past') {
    alert('This slot has already ended — focus mode can\u2019t start.');
    return;
  }
  if (status === 'upcoming') {
    // pull the slot's start time forward to right now, so tapping "Start now"
    // on a not-yet-started slot begins it immediately instead of waiting
    slot.start = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }
  const nowMs = now.getTime();
  focusTimers[String(id)] = { key, startedAt: nowMs };
  slot.live = { startedAt: nowMs, heartbeatAt: nowMs };
  saveFocusTimers();
  save();
  // always rebuild the whole row (not just the focus controls) so the visible
  // start time is guaranteed to match the data, never left showing a stale value
  renderSlotList(key, document.getElementById('slot-list'));
  refreshStats(key);
}

function stopFocus(key, id) {
  const slot = (data[key] || []).find(s => s.id === id);
  const idKey = String(id);
  const timer = focusTimers[idKey];
  if (!slot || !timer) return;
  finalizeTimer(idKey);
  saveFocusTimers();
  save();
  refreshFocusArea(key, slot, new Date());
  refreshStats(key);
}

function resetFocus(key, id) {
  const slot = (data[key] || []).find(s => s.id === id);
  delete focusTimers[String(id)];   // Reset discards the session's time by design
  saveFocusTimers();
  if (slot) { delete slot.live; save(); refreshFocusArea(key, slot, new Date()); }
  refreshStats(key);
}

function refreshFocusArea(key, slot, now) {
  const el = document.getElementById('focus-area-' + slot.id);
  if (!el) return;
  el.replaceWith(buildFocusArea(key, slot, now));
}

// runs every second regardless of which view is open, so a running focus
// session still finalizes correctly even if you've navigated back to the calendar
function tickFocus() {
  const now = new Date();
  const nowMs = now.getTime();

  Object.keys(focusTimers).forEach(idKey => {
    const t = focusTimers[idKey];
    const slot = (data[t.key] || []).find(s => String(s.id) === idKey);
    if (!slot) { delete focusTimers[idKey]; saveFocusTimers(); return; }
    const end = combineDateTime(t.key, slot.end).getTime();
    if (nowMs >= end) {
      // slot's scheduled time is over — finalize the session as if Stop was pressed
      finalizeTimer(idKey, nowMs);
      saveFocusTimers();
      save();
    }
  });

  if (view === 'day' && activeDate) {
    const key = activeDate;
    daySlots(key).forEach(slot => refreshFocusArea(key, slot, now));
    refreshStats(key);
  }
}

function updateSlot(key, id, field, value, skipRebuild) {
  const slot = (data[key] || []).find(s => s.id === id);
  if (!slot) return;
  slot[field] = value;
  save();
  if (!skipRebuild) renderSlotList(key, document.getElementById('slot-list'));
  if (field === 'label') refreshSummaryBoxes(key);
}

function attachTapHandlers(node, key, id) {
  let tapTimer = null;
  node.addEventListener('click', () => {
    if (tapTimer) {
      clearTimeout(tapTimer);
      tapTimer = null;
      toggleBled(key, id);
    } else {
      tapTimer = setTimeout(() => {
        tapTimer = null;
        toggleDone(key, id);
      }, 280);
    }
  });
}

function refreshStats(key) {
  const hv = document.getElementById('day-hours-val');
  if (hv) hv.textContent = fmtHours(dayHours(key));
  const fv = document.getElementById('day-focus-val');
  if (fv) fv.textContent = fmtHours(dayFocusHours(key));
  const bv = document.getElementById('day-bled-val');
  if (bv) bv.textContent = fmtHours(bledHours(key));
  const brv = document.getElementById('day-break-val');
  if (brv) brv.textContent = fmtHours(breakHours(key));
  refreshSummaryBoxes(key);
}

// single tap = completion mark. Fully independent of bled and of focus time:
// it only tracks how many sessions were completed.
function toggleDone(key, id) {
  const slot = (data[key] || []).find(s => s.id === id);
  if (!slot) return;
  setFlag(key, id, 'done', !slot.done);
  renderSlotList(key, document.getElementById('slot-list'));
  refreshStats(key);
}

// double tap = bled mark, equally independent of the completion mark
function toggleBled(key, id) {
  const slot = (data[key] || []).find(s => s.id === id);
  if (!slot) return;
  setFlag(key, id, 'bled', !slot.bled);
  renderSlotList(key, document.getElementById('slot-list'));
  refreshStats(key);
}

function addSlot(key) {
  if (!data[key]) data[key] = [];
  const existing = daySlots(key).slice().sort((a, b) => (a.start < b.start ? -1 : 1));
  const last = existing[existing.length - 1];
  const start = last ? last.end : '09:00';
  const [h, m] = start.split(':').map(Number);
  const eh = Math.min(h + 1, 23);
  const end = pad(eh) + ':' + pad(m);
  data[key].push({ id: nextId(), start, end, label: '', done: false, bled: false, focusSeconds: 0 });
  save();
  renderSlotList(key, document.getElementById('slot-list'));
}

function removeSlot(key, id) {
  data[key] = (data[key] || []).filter(s => s.id !== id);
  save();
  renderSlotList(key, document.getElementById('slot-list'));
  refreshStats(key);
}

// ---- live tick: updates clock, remaining time, current-slot banner, and node status
// without rebuilding inputs, so typing/focus is preserved ----
function tick() {
  if (view !== 'day' || !activeDate) return;
  const now = new Date();
  const key = activeDate;

  const clockEl = document.getElementById('clock');
  if (clockEl) clockEl.textContent = fmtClock(now);

  const slots = daySlots(key).slice().sort((a, b) => (a.start < b.start ? -1 : 1));
  const totalRemaining = slots.reduce((sum, s) => sum + remainingOf(s, key, now), 0);
  const remEl = document.getElementById('remaining');
  if (remEl) remEl.textContent = fmtDuration(totalRemaining);

  const current = slots.find(s => timeStatus(s, key, now) === 'current');
  const upcoming = slots.find(s => timeStatus(s, key, now) === 'upcoming');
  const banner = document.getElementById('banner');
  if (banner) {
    banner.innerHTML = '';
    if (current) {
      banner.className = 'banner';
      const dot = document.createElement('div');
      dot.className = 'dot';
      const mid = document.createElement('div');
      mid.style.flex = '1';
      const lbl = document.createElement('div');
      lbl.className = 'banner-label';
      lbl.textContent = current.label || 'Current slot';
      const sub = document.createElement('div');
      sub.className = 'banner-sub';
      sub.textContent = current.start + '–' + current.end;
      mid.append(lbl, sub);
      const cd = document.createElement('div');
      cd.className = 'countdown';
      cd.textContent = fmtCountdown(remainingOf(current, key, now));
      banner.append(dot, mid, cd);
    } else if (upcoming) {
      banner.className = 'banner gap';
      banner.textContent = 'No active slot · next "' + (upcoming.label || 'slot') + '" at ' + upcoming.start;
    } else if (slots.length) {
      banner.className = 'banner gap';
      banner.textContent = 'This day\u2019s scheduled slots have passed';
    } else {
      banner.className = 'banner gap';
      banner.textContent = 'No slots scheduled';
    }
  }

  // update node/card status classes in place (skip if a slot's manually marked)
  const rows = document.querySelectorAll('#slot-list .timeline-row');
  rows.forEach((row, i) => {
    const slot = slots[i];
    if (!slot) return;
    const auto = slot.done ? 'manual' : slot.bled ? 'bled' : timeStatus(slot, key, now);
    const node = row.querySelector('.node');
    const card = row.querySelector('.slot-card');
    if (node) {
      node.className = 'node ' + auto + (slot.done && slot.bled ? ' bled-flag' : '');
      node.textContent = slot.done ? '\u2713' : slot.bled ? '\u2715' : '';
    }
    if (card) card.className = 'slot-card ' + auto;
    // safety net: keep the displayed start/end in sync with the data
    // (e.g. after a "Start now" shift) unless the person has that field open
    const timeInputs = row.querySelectorAll('input[type="time"]');
    const startEl = timeInputs[0], endEl = timeInputs[1];
    if (startEl && document.activeElement !== startEl && startEl.value !== slot.start) startEl.value = slot.start;
    if (endEl && document.activeElement !== endEl && endEl.value !== slot.end) endEl.value = slot.end;
  });
}

/* =====================================================================
   Supabase sync
   ---------------------------------------------------------------------
   Model: localStorage is the working copy; `snapshot` records what we
   believe the server currently holds for each day. Comparing the two
   tells us exactly which days changed locally, with no dirty-tracking
   sprinkled through the UI code.

   A day is only ever overwritten wholesale when we have no local edit
   pending for it. When both sides changed, the two slot lists are merged
   rather than one replacing the other, so a logged session can't be
   destroyed by the other device.
   ===================================================================== */

const SNAPSHOT_KEY = 'schedule-calendar-snapshot';
let sb = null;              // supabase client
let session = null;         // current auth session
let snapshot = {};          // { day: JSON string the server is believed to hold }
let pulled = false;         // never push before a first successful pull
let flushTimer = null;
let retryTimer = null;
let offlineOnly = false;    // user chose "this device only"

function cfgOk() {
  const c = window.APP_CONFIG || {};
  return !!(c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
            c.SUPABASE_URL.indexOf('YOUR-') === -1 &&
            c.SUPABASE_ANON_KEY.indexOf('YOUR-') === -1);
}

function setSync(state, text) {
  const pill = document.getElementById('sync-pill');
  if (!pill) return;
  pill.hidden = false;
  pill.className = 'sync-pill ' + state;
  document.getElementById('sync-text').textContent = text;
}

// ---- merge: union by slot id, never losing logged time or a mark ----
function mergeSlots(local, remote) {
  const out = {};
  (remote || []).forEach(r => { out[r.id] = Object.assign({}, r); });
  (local || []).forEach(l => {
    const r = out[l.id];
    if (!r) { out[l.id] = Object.assign({}, l); return; }
    // a to-do has no time to lose, so the union used below would only ever
    // resurrect a tick the other device already cleared — take local as-is
    if (l.kind === 'todo' || r.kind === 'todo') { out[l.id] = Object.assign({}, l); return; }
    // whichever side logged more focus time is treated as the fresher edit
    // for the descriptive fields; the numeric and boolean fields take the
    // safer union so nothing recorded on either device disappears
    const base = (l.focusSeconds || 0) >= (r.focusSeconds || 0) ? l : r;
    out[l.id] = Object.assign({}, base, {
      focusSeconds: Math.max(l.focusSeconds || 0, r.focusSeconds || 0),
      done: !!(l.done || r.done),
      bled: !!(l.bled || r.bled),
    });
  });
  return Object.keys(out).map(k => out[k]).sort((a, b) => (a.start < b.start ? -1 : 1));
}

function normalizeSlots(slots) {
  const wrap = normalize({ d: Array.isArray(slots) ? slots : [] });
  return wrap.d;
}

async function pull() {
  if (!sb || !session) return;
  setSync('syncing', 'syncing');
  const res = await sb.from('study_days').select('day, slots');
  if (res.error) { setSync('offline', 'offline'); return; }

  let changed = false;
  (res.data || []).forEach(row => {
    const remoteSlots = normalizeSlots(row.slots);
    const remoteStr = JSON.stringify(remoteSlots);
    const localStr = data[row.day] ? JSON.stringify(data[row.day]) : null;

    if (localStr === null) {                    // day only exists on the server
      data[row.day] = remoteSlots; snapshot[row.day] = remoteStr; changed = true;
    } else if (localStr === remoteStr) {        // already in agreement
      snapshot[row.day] = remoteStr;
    } else if (localStr === snapshot[row.day]) { // no local edit pending -> take server
      data[row.day] = remoteSlots; snapshot[row.day] = remoteStr; changed = true;
    } else if (remoteStr === snapshot[row.day]) { // only we changed -> keep local, flush pushes it
      /* keep local */
    } else {                                     // both sides changed -> merge
      data[row.day] = mergeSlots(data[row.day], remoteSlots); changed = true;
    }
  });

  pulled = true;
  if (changed) { store.set(STORAGE_KEY, JSON.stringify(data)); renderApp(); }
  store.set(SNAPSHOT_KEY, JSON.stringify(snapshot));
  await flush();
}

async function flush() {
  if (!sb || !session || !pulled) return;
  const changed = Object.keys(data).filter(k => JSON.stringify(data[k]) !== snapshot[k]);
  if (!changed.length) { setSync('synced', 'synced'); return; }

  setSync('syncing', 'saving');
  const rows = changed.map(k => ({ user_id: session.user.id, day: k, slots: data[k] }));
  const res = await sb.from('study_days').upsert(rows, { onConflict: 'user_id,day' });
  if (res.error) {
    // nothing is lost: localStorage already holds it, and we retry
    setSync('offline', 'offline');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, 20000);
    return;
  }
  changed.forEach(k => { snapshot[k] = JSON.stringify(data[k]); });
  store.set(SNAPSHOT_KEY, JSON.stringify(snapshot));
  setSync('synced', 'synced');
}

function scheduleFlush() {
  if (!sb || !session) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 2000);   // debounce: one write per burst of edits
}

// ---- auth ----
function showAuth(show) { document.getElementById('auth-overlay').hidden = !show; }

async function signIn(email, password) {
  const res = await sb.auth.signInWithPassword({ email: email, password: password });
  if (res.error) throw res.error;
  session = res.data.session;
  await afterSignIn();
}

async function afterSignIn() {
  showAuth(false);
  setSync('syncing', 'syncing');
  await pull();
}

async function signOut() {
  clearTimeout(flushTimer); clearTimeout(retryTimer);
  await flush();
  await sb.auth.signOut();
  session = null; pulled = false; snapshot = {};
  store.set(SNAPSHOT_KEY, '{}');
  setSync('', 'signed out');
  showAuth(true);
}

function wireAuthUI() {
  const form = document.getElementById('auth-form');
  const btn = document.getElementById('auth-btn');
  const err = document.getElementById('auth-err');

  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Signing in\u2026';
    try {
      await signIn(document.getElementById('auth-email').value.trim(),
                   document.getElementById('auth-pass').value);
    } catch (ex) {
      err.textContent = (ex && ex.message) || 'Could not sign in.';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };

  document.getElementById('auth-offline').onclick = () => {
    offlineOnly = true;
    showAuth(false);
    setSync('offline', 'this device only');
  };

  const pill = document.getElementById('sync-pill');
  const menu = document.getElementById('sync-menu');
  pill.onclick = () => {
    if (!session) { showAuth(true); return; }
    menu.hidden = !menu.hidden;
  };
  document.getElementById('menu-sync').onclick = () => { menu.hidden = true; pull(); };
  document.getElementById('menu-signout').onclick = () => { menu.hidden = true; signOut(); };
  document.addEventListener('click', e => {
    if (!menu.hidden && !menu.contains(e.target) && e.target !== pill && !pill.contains(e.target)) menu.hidden = true;
  });
}

async function initSync() {
  wireAuthUI();

  if (!cfgOk()) {
    setSync('offline', 'local only \u2014 not configured');
    return;
  }
  if (typeof window.supabase === 'undefined') {
    // CDN blocked or offline: the app still works entirely on this device
    setSync('offline', 'offline');
    return;
  }

  sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  try { snapshot = JSON.parse(store.get(SNAPSHOT_KEY) || '{}'); } catch (e) { snapshot = {}; }

  const res = await sb.auth.getSession();
  session = res.data.session;
  if (session) { await afterSignIn(); } else { showAuth(true); }

  // pick up the other device's changes when returning to the app, and slowly
  // while it sits open
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && session) pull();
  });
  setInterval(() => { if (session && !document.hidden) pull(); }, 60000);
  window.addEventListener('online', () => { if (session) pull(); });
  // last-ditch flush when the tab is backgrounded or closed
  window.addEventListener('pagehide', () => { if (session && pulled) flush(); });
}

(async function init() {
  data = load();
  restoreFocusTimers();   // before the first render, so a live slot paints as live
  renderApp();

  // Bank running time whenever the page goes away. Registered here rather than
  // in initSync(), which returns early when Supabase isn't configured — these
  // must attach even in local-only mode.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) checkpointFocus();
    else { tickFocus(); tick(); }   // snap the frozen countdown back immediately
  });
  window.addEventListener('pagehide', checkpointFocus);
  document.addEventListener('freeze', checkpointFocus);          // Chrome discard
  window.addEventListener('pageshow', () => { tickFocus(); tick(); });  // bfcache

  await initSync();
})();
setInterval(() => { tickFocus(); tick(); }, 1000);
// heartbeat a running session's progress even while the tab stays in the
// foreground, so another device isn't stuck showing it as not-running
// until this one backgrounds or Stop is pressed
setInterval(checkpointFocus, LIVE_HEARTBEAT_MS);
</script>
</body>
</html>
